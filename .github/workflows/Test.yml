name: Musl Smoke Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-musl-binary:
    name: Validar ejecución en Void Linux musl
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Descargar el último release y ejecutar prueba en contenedor Void musl
        run: |
          # 1. Crear directorio temporal para la prueba
          mkdir -p test_env
          
          echo "=== 📥 Descargando el último release desde GitHub ==="
          # Usamos la API de GitHub para obtener la URL del tar.gz del último release de este repo
          REPO="${{ github.repository }}"
          TARBALL_URL=$(curl -s "https://api.github.com/repos/$REPO/releases/latest" | grep "browser_download_url" | grep ".tar.gz" | cut -d '"' -f 4 | head -n 1)
          
          if [ -z "$TARBALL_URL" ]; then
            echo "⚠️ No se encontró un tar.gz en el último release 'latest'. Intentando descargar desde tags..."
            TARBALL_URL=$(curl -s "https://api.github.com/repos/$REPO/releases" | grep "browser_download_url" | grep ".tar.gz" | cut -d '"' -f 4 | head -n 1)
          fi

          if [ -z "$TARBALL_URL" ]; then
            echo "❌ Error: No se pudo encontrar ningún tar.gz adjunto en los Releases de este repositorio."
            exit 1
          fi

          echo "🔗 Descargando desde: $TARBALL_URL"
          curl -L -o test_env/bespoke.tar.gz "$TARBALL_URL"

          # 2. Ejecutar el contenedor de Void Linux con el tarball descargado
          docker run --rm -v ${{ github.workspace }}/test_env:/workspace voidlinux/voidlinux-musl sh -c "
            set -e
            echo '=== 0. Arreglando repositorios y certificados SSL ==='
            mkdir -p /etc/xbps.d
            echo 'repository=https://repo-default.voidlinux.org/current/musl' > /etc/xbps.d/00-repository-main.conf
            SSL_NO_VERIFY=1 xbps-install -Syu xbps ca-certificates

            echo '=== 1. Instalando dependencias (tar, mesa, pipewire) ==='
            xbps-install -Sy bash mesa-dri pipewire libjack-pipewire xorg-server-xvfb tar findutils gzip

            echo '=== 2. Iniciando servidor gráfico virtual Xvfb ==='
            Xvfb :99 -screen 0 1280x1024x24 &
            XVFB_PID=\$!
            export DISPLAY=:99
            sleep 2

            echo '=== 3. Descomprimiendo el Release ==='
            cd /workspace
            mkdir -p extracted_app
            tar -xzf bespoke.tar.gz -C extracted_app
            
            BINARY=\$(find extracted_app -name \"BespokeSynth\" -type f -executable | head -n 1)
            
            if [ -z \"\$BINARY\" ]; then
              echo \"❌ No se encontró el binario ejecutable dentro del tar.gz.\"
              exit 1
            fi
            
            echo \"✅ Binario localizado: \$BINARY\"

            echo '=== 4. Ejecutando BespokeSynth (Test de 8 segundos) ==='
            GALLIUM_DRIVER=llvmpipe \$BINARY --dummy-audio &
            APP_PID=\$!

            sleep 8

            if kill -0 \$APP_PID 2>/dev/null; then
              echo '✅ ÉXITO: BespokeSynth se ejecutó correctamente en Void musl.'
              kill \$APP_PID 2>/dev/null || true
              kill \$XVFB_PID 2>/dev/null || true
              exit 0
            else
              echo '❌ ERROR: El ejecutable colapsó o se cerró antes de tiempo.'
              kill \$XVFB_PID 2>/dev/null || true
              exit 1
            fi
          "
