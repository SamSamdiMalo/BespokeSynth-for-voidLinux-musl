name: Musl Smoke Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-musl-binary:
    name: Validar ejecución en Void Linux musl
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente / artefactos
        uses: actions/checkout@v4

      - name: Ejecutar prueba headless en contenedor Void musl
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace voidlinux/voidlinux-musl sh -c "
            set -e
            echo '=== 0. Arreglando repositorios y certificados SSL ==='
            mkdir -p /etc/xbps.d
            echo 'repository=https://repo-default.voidlinux.org/current/musl' > /etc/xbps.d/00-repository-main.conf
            SSL_NO_VERIFY=1 xbps-install -Syu xbps ca-certificates

            echo '=== 1. Instalando dependencias (incluyendo tar) ==='
            xbps-install -Sy bash mesa-dri pipewire libjack-pipewire xorg-server-xvfb tar findutils gzip

            echo '=== 2. Iniciando servidor gráfico virtual Xvfb ==='
            Xvfb :99 -screen 0 1280x1024x24 &
            XVFB_PID=\$!
            export DISPLAY=:99
            sleep 2

            echo '=== 3. Localizando y descomprimiendo el tar.gz ==='
            cd /workspace
            TARBALL=\$(find . -maxdepth 2 -name \"*.tar.gz\" | head -n 1)
            
            if [ -z \"\$TARBALL\" ]; then
              echo \"❌ No se encontró ningún archivo .tar.gz en el repositorio.\"
              exit 1
            fi
            
            echo \"📦 Descomprimiendo: \$TARBALL\"
            mkdir -p extracted_app
            tar -xzf \"\$TARBALL\" -C extracted_app
            
            BINARY=\$(find extracted_app -name \"BespokeSynth\" -type f -executable | head -n 1)
            
            if [ -z \"\$BINARY\" ]; then
              echo \"❌ No se encontró el binario ejecutable dentro del tar.gz.\"
              exit 1
            fi
            
            echo \"✅ Binario localizado: \$BINARY\"

            echo '=== 4. Ejecutando BespokeSynth (Test de 8 segundos) ==='
            GALLIUM_DRIVER=llvmpipe \$BINARY --dummy-audio &
            APP_PID=\$!

            sleep 8

            if kill -0 \$APP_PID 2>/dev/null; then
              echo '✅ ÉXITO: BespokeSynth se ejecutó correctamente en Void musl.'
              kill \$APP_PID 2>/dev/null || true
              kill \$XVFB_PID 2>/dev/null || true
              exit 0
            else
              echo '❌ ERROR: El ejecutable colapsó o se cerró antes de tiempo.'
              kill \$XVFB_PID 2>/dev/null || true
              exit 1
            fi
          "
