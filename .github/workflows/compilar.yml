name: Compilar BespokeSynth para Void Linux (Musl)

on:
  workflow_dispatch:

jobs:
  build-musl:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      # 1. Instalar dependencias usando los nombres de paquetes modernos de Alpine
      - name: Instalar herramientas esenciales y dependencias de audio
        run: |
          apk update
          apk add --no-cache cmake g++ git make python3-dev \
            alsa-lib-dev jack-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev freetype-dev curl-dev \
            nodejs bash libxext-dev libxrender-dev libxi-dev glib-dev \
            mesa-dev gtk+3.0-dev webkit2gtk-4.1-dev

      # 2. Clonar el repositorio oficial
      - name: Clonar código fuente y submódulos
        run: |
          git clone --recursive https://github.com/BespokeSynth/BespokeSynth.git
          
      # 3. Configurar inyectando los parámetros para evitar buscar execinfo.h
      - name: Configurar CMake
        run: |
          cmake -S BespokeSynth -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBESPOKE_BUILD_AUTO_UPDATER=OFF \
            -DCMAKE_CXX_FLAGS="-DJUCE_ALLOW_STATIC_BACKTRACE=0" \
            -DCMAKE_C_FLAGS="-DJUCE_ALLOW_STATIC_BACKTRACE=0"

      # 4. Compilar el binario nativo Musl en paralelo
      - name: Compilar ejecutable
        run: cmake --build build --config Release -j4

      # 5. Empaquetar el resultado para distribución
      - name: Preparar paquete de distribución
        run: |
          mkdir -p dist
          cp -r build/Source/BespokeSynth_artefacts/Release/* dist/ || cp -r build/BespokeSynth_artefacts/Release/* dist/ || cp -r build/Source/BespokeSynth_artefacts/* dist/
          tar -czvf bespokesynth-void-musl.tar.gz -C dist .

      # 6. Guardar copia en Artifacts de respaldo
      - name: Guardar copia en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BespokeSynth-Void-Musl
          path: bespokesynth-void-musl.tar.gz

      # 7. Crear el Release público
      - name: Crear Release Público Permanente
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}-musl
          name: BespokeSynth Nativo para Musl (Build #${{ github.run_number }})
          body: |
            Binario nativo de BespokeSynth compilado dinámicamente en entorno Musl (Alpine/Void Linux).
            ¡No requiere gcompat ni capas de traducción!
          draft: false
          prerelease: false
          files: bespokesynth-void-musl.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
