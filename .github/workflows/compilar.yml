name: Compilar BespokeSynth para Void Linux (Musl)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-musl:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar BespokeSynth dentro de Void Linux Musl
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/void-linux/void-musl:latest sh -c "
            set -e
            
            # 1. Instalar dependencias dentro del contenedor Musl
            xbps-install -Syu || xbps-install -Syu
            xbps-install -y git cmake gcc make pkg-config python3 python3-devel \
              alsa-lib-devel jack-devel libX11-devel libXrandr-devel \
              libXinerama-devel libXcursor-devel freetype-devel libcurl-devel \
              nodejs bash libXext-devel libXrender-devel libXi-devel glib-devel \
              MesaLib-devel gtk+3-devel libwebkit2gtk41-devel libexecinfo-devel \
              findutils sed tar gzip

            # 2. Clonar código fuente y submódulos
            git clone --recursive https://github.com/BespokeSynth/BespokeSynth.git

            # 3. Aplicar parches de JUCE para Musl
            cd BespokeSynth/libs/JUCE
            find . -type f -name 'juce_SystemStats_linux.cpp' -exec sed -i 's/#include <sys\/sysctl.h>/\/\/ #include <sys\/sysctl.h>/g' {} +
            find . -type f -name 'juce_SystemStats_linux.cpp' -exec sed -i 's/getLocaleValue (_NL_ADDRESS_LANG_AB)/String()/g' {} +
            find . -type f -name 'juce_SystemStats_linux.cpp' -exec sed -i 's/getLocaleValue (_NL_ADDRESS_COUNTRY_AB2)/String()/g' {} +
            find . -type f -name 'juce_SharedCode_posix.h' -exec sed -i 's/stat64/stat/g' {} +
            cd ../../..

            # 4. Configurar y compilar
            export CFLAGS='-Wno-error -Wno-unused-function'
            export CXXFLAGS='-Wno-error -Wno-unused-function'
            export LDFLAGS='-lexecinfo'

            cmake -S BespokeSynth -B build -DCMAKE_BUILD_TYPE=Release -DBESPOKE_BUILD_AUTO_UPDATER=OFF
            cmake --build build --config Release -j4

            # 5. Empaquetar
            mkdir -p dist
            cp -r build/Source/BespokeSynth_artefacts/Release/* dist/ || cp -r build/BespokeSynth_artefacts/Release/* dist/ || cp -r build/Source/BespokeSynth_artefacts/* dist/
            tar -czvf bespokesynth-void-musl.tar.gz -C dist .
          "

      - name: Guardar copia en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BespokeSynth-Void-Musl
          path: ${{ github.workspace }}/bespokesynth-void-musl.tar.gz

      - name: Crear Release Público Permanente
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-musl
          name: BespokeSynth Nativo para Musl (Build #${{ github.run_number }})
          body: |
            Binario nativo de BespokeSynth compilado de forma nativa en Void Linux Musl.
            ¡No requiere gcompat ni capas de traducción secundarias!
          draft: false
          prerelease: false
          files: ${{ github.workspace }}/bespokesynth-void-musl.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
