name: Compilar BespokeSynth para Void Linux (Musl)

on:
  workflow_dispatch:

jobs:
  build-musl:
    runs-on: ubuntu-latest

    # Metemos un contenedor nativo de Musl (Alpine) dentro del servidor
    container:
      image: alpine:latest

    steps:
      - name: Instalar herramientas y dependencias en entorno Musl
        run: |
          apk update
          apk add --no-cache cmake g++ git make python3-dev \
            alsa-lib-dev jack-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev freetype-dev curl-dev

      - name: Clonar BespokeSynth
        uses: actions/checkout@v4
        with:
          repository: 'BespokeSynth/BespokeSynth'
          submodules: 'recursive'

      - name: Configurar CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBESPOKE_BUILD_AUTO_UPDATER=OFF

      - name: Compilar ejecutable nativo
        run: cmake --build build --config Release -j4

      - name: Guardar binario Musl terminado
        uses: actions/upload-artifact@v4
        with:
          name: BespokeSynth-Void-Musl
          path: |
            build/BespokeSynth_artefacts/Release/
            
